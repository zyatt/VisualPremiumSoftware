name: visual_premium
description: Visual Premium - Sistema de Gestão de Materiais e Compras
publish_to: 'none'
version: 4.4.0+37

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  # HTTP & Auth
  http: ^1.2.1
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.0

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  shimmer: ^3.0.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.13.1

  # Updates
  package_info_plus: 9.0.1

  # Utils
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  go_router: ^17.2.3
  uuid: ^4.5.3

  # Imagem — seleção de arquivo do dispositivo (solicitações de material)
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/